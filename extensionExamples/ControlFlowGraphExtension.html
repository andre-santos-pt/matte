<!DOCTYPE html>
<html>
<head>
    <title>Control-flow graph</title>
    <style>
        .control-flow {
            overflow: auto;
            padding: 8px;
            font-family: Arial, sans-serif;
        }

        .control-flow-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            color: #35556f;
            font-size: 13px;
        }

        .control-flow-toolbar select {
            max-width: 100%;
            padding: 3px 6px;
        }

        .control-flow-message {
            padding: 8px;
            color: #687887;
            font-size: 13px;
        }

        .control-flow svg {
            display: block;
            font-family: Arial, sans-serif;
        }

        .control-flow .cfg-edge {
            fill: none;
            stroke: #718494;
            stroke-width: 1.5;
        }

        .control-flow .cfg-edge-label {
            fill: #526879;
            font-size: 10px;
        }

        .control-flow .cfg-node rect {
            fill: #f5f9fc;
            stroke: #8da1b3;
            stroke-width: 1.5;
        }

        .control-flow .cfg-node.cfg-decision rect {
            fill: #fff8df;
            stroke: #c3a74d;
        }

        .control-flow .cfg-node.cfg-terminal ellipse {
            fill: #e8f4eb;
            stroke: #6f9c79;
            stroke-width: 1.5;
        }

        .control-flow .cfg-node text {
            fill: #263b4b;
            font-size: 11px;
            text-anchor: middle;
        }

        .control-flow .cfg-node.cfg-terminal text {
            font-weight: bold;
        }
    </style>
</head>
<body>
<script src="../dist/matte-web-ace.js" defer></script>
<script>
function controlflow_matte(editor) {
    const root = document.createElement("div");
    root.className = "control-flow";

    const toolbar = document.createElement("div");
    toolbar.className = "control-flow-toolbar";
    const label = document.createElement("label");
    label.textContent = "Control flow for";
    const select = document.createElement("select");
    label.append(select);
    toolbar.append(label);

    const graph = document.createElement("div");
    root.append(toolbar, graph);

    let compilation;
    let selectedIndex = 0;
    const nodeWidth = 100;
    const nodeHeight = 20;
    const horizontalGap = 60;
    const verticalGap = 60;
    const margin = 24;

    function sourceText(range) {
        if (!range)
            return "";
        return range.text ?? editor.getValue().slice(range.start, range.end);
    }

    function expressionText(expression) {
        return sourceText(expression?.range) || "?";
    }

    function makeProcedureLabel(procedure) {
        const owner = procedure.parent?.name;
        const parameters = (procedure.parameters ?? [])
            .map(parameter => `${parameter.type} ${parameter.name}`)
            .join(", ");
        return `${owner ? owner + "." : ""}${procedure.name}(${parameters})`;
    }

    function getBodies(program) {
        const bodies = [];
        if (program.block)
            bodies.push({label: "(script)", body: program.block});
        (program.procedures ?? []).forEach(procedure => {
            if (procedure.body)
                bodies.push({label: makeProcedureLabel(procedure), body: procedure.body});
        });
        return bodies;
    }

    function addOption(bodies, index) {
        const option = document.createElement("option");
        option.value = String(index);
        option.textContent = bodies[index].label;
        select.append(option);
    }

    function buildGraph(body) {
        const nodes = [];
        const edges = [];

        function addNode(text, kind, range) {
            const node = {id: nodes.length, text: text || "statement", kind, range};
            nodes.push(node);
            return node.id;
        }

        function addEdge(from, to, label) {
            if (from != null && to != null)
                edges.push({from, to, label: label || ""});
        }

        const entry = addNode("Entry", "terminal");
        const exit = addNode("Exit", "terminal");

        function buildStatement(statement, next, breakTarget) {
            if (!statement)
                return next;

            if (Array.isArray(statement.statements)) {
                let start = next;
                for (let i = statement.statements.length - 1; i >= 0; i--)
                    start = buildStatement(statement.statements[i], start, breakTarget);
                return start;
            }

            if (statement.guard && statement.thenBranch) {
                const condition = addNode(
                    `if (${expressionText(statement.guard)})`,
                    "decision",
                    statement.guard.range
                );
                const thenStart = buildStatement(statement.thenBranch, next, breakTarget);
                const elseStart = statement.elseBranch
                    ? buildStatement(statement.elseBranch, next, breakTarget)
                    : next;
                addEdge(condition, thenStart, "true");
                addEdge(condition, elseStart, "false");
                return condition;
            }

            if (statement.guard && statement.body) {
                const condition = addNode(
                    `while (${expressionText(statement.guard)})`,
                    "decision",
                    statement.guard.range
                );
                const bodyStart = buildStatement(statement.body, condition, next);
                addEdge(condition, bodyStart, "true");
                addEdge(condition, next, "false");
                return condition;
            }

            const text = sourceText(statement.range).trim() || "statement";
            if (/^return\b/.test(text)) {
                const node = addNode(text, "statement", statement.range);
                addEdge(node, exit);
                return node;
            }
            if (/^break\b/.test(text)) {
                const node = addNode(text, "statement", statement.range);
                addEdge(node, breakTarget ?? exit);
                return node;
            }

            const node = addNode(text, "statement", statement.range);
            addEdge(node, next);
            return node;
        }

        const bodyStart = buildStatement(body, exit, exit);
        addEdge(entry, bodyStart);

        const depths = new Map();
        let maxDepth = 0;
        function assignDepth(start, startDepth) {
            const queue = [start];
            depths.set(start, startDepth);
            while (queue.length) {
                const from = queue.shift();
                const nextDepth = depths.get(from) + 1;
                maxDepth = Math.max(maxDepth, depths.get(from));
                edges.forEach(edge => {
                    if (edge.from === from && edge.to !== exit && !depths.has(edge.to)) {
                        depths.set(edge.to, nextDepth);
                        queue.push(edge.to);
                    }
                });
            }
        }

        assignDepth(entry, 0);
        nodes.filter(node => node.id !== exit).forEach(node => {
            if (!depths.has(node.id))
                assignDepth(node.id, maxDepth + 1);
        });
        depths.set(exit, maxDepth + 1);

        const layers = new Map();
        nodes.forEach(node => {
            const depth = depths.get(node.id);
            if (!layers.has(depth))
                layers.set(depth, []);
            layers.get(depth).push(node.id);
        });
        const maxColumns = Math.max(...Array.from(layers.values(), layer => layer.length), 1);
        const contentWidth = margin * 2 + maxColumns * nodeWidth + (maxColumns - 1) * horizontalGap;
        const allOutgoing = new Map();
        const allIncoming = new Map();
        const tracks = new Map();
        const sourceTracks = new Map();
        const targetTracks = new Map();
        const sideIndices = new Map();
        let nextSideIndex = 0;
        function addTrack(depth, edge) {
            const depthTracks = tracks.get(depth) ?? [];
            const index = depthTracks.length;
            depthTracks.push(edge);
            tracks.set(depth, depthTracks);
            return index;
        }
        edges.forEach(edge => {
            allOutgoing.set(edge.from, [...(allOutgoing.get(edge.from) ?? []), edge]);
            allIncoming.set(edge.to, [...(allIncoming.get(edge.to) ?? []), edge]);
            const fromDepth = depths.get(edge.from);
            const toDepth = depths.get(edge.to);
            if (toDepth === fromDepth + 1) {
                edge.route = "forward";
                sourceTracks.set(edge, addTrack(fromDepth, edge));
            } else {
                edge.route = "side";
                sideIndices.set(edge, nextSideIndex++);
                sourceTracks.set(edge, addTrack(fromDepth, edge));
                targetTracks.set(edge, addTrack(toDepth - 1, edge));
            }
        });
        const graphDepth = Math.max(...depths.values());
        const sideWidth = 32 + nextSideIndex * 18;
        const width = contentWidth + sideWidth;
        const depthY = new Map([[0, margin]]);
        for (let depth = 0; depth < graphDepth; depth++) {
            const gap = Math.max(verticalGap, nodeHeight + 20 + (tracks.get(depth)?.length ?? 0) * 8);
            depthY.set(depth + 1, depthY.get(depth) + nodeHeight + gap);
        }
        const height = depthY.get(graphDepth) + nodeHeight + margin;
        const trackY = new Map();
        tracks.forEach((depthTracks, depth) => {
            const bottom = depthY.get(depth) + nodeHeight;
            const gap = depthY.get(depth + 1) - bottom;
            depthTracks.forEach((edge, index) => {
                trackY.set(`${depth}:${index}`, bottom + gap * (index + 1) / (depthTracks.length + 1));
            });
        });
        const positions = new Map();
        layers.forEach((layer, depth) => {
            const layerWidth = layer.length * nodeWidth + (layer.length - 1) * horizontalGap;
            const left = (contentWidth - layerWidth) / 2;
            layer.forEach((id, column) => {
                positions.set(id, {
                    x: left + column * (nodeWidth + horizontalGap),
                    y: depthY.get(depth)
                });
            });
        });

        return {
            nodes, edges, positions, width, height, depths, contentWidth,
            allOutgoing, allIncoming, sourceTracks, targetTracks, trackY, sideIndices
        };
    }

    function wrapText(text) {
        const words = text.replace(/\s+/g, " ").split(" ");
        const lines = [];
        let line = "";
        words.forEach(word => {
            const candidate = line ? `${line} ${word}` : word;
            if (candidate.length > 21 && line) {
                lines.push(line);
                line = word;
            } else {
                line = candidate;
            }
        });
        if (line)
            lines.push(line);
        if (lines.length > 3) {
            lines.length = 3;
            lines[2] = lines[2].slice(0, 18) + "...";
        }
        return lines;
    }

    function renderGraph(body) {
        const {
            nodes, edges, positions, width, height, depths, contentWidth,
            allOutgoing, allIncoming, sourceTracks, targetTracks, trackY, sideIndices
        } = buildGraph(body);
        const ns = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(ns, "svg");
        svg.setAttribute("width", String(width));
        svg.setAttribute("height", String(height));
        svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

        const defs = document.createElementNS(ns, "defs");
        const marker = document.createElementNS(ns, "marker");
        marker.setAttribute("id", "cfg-arrow");
        marker.setAttribute("viewBox", "0 0 10 10");
        marker.setAttribute("refX", "9");
        marker.setAttribute("refY", "5");
        marker.setAttribute("markerWidth", "6");
        marker.setAttribute("markerHeight", "6");
        marker.setAttribute("orient", "auto-start-reverse");
        const arrow = document.createElementNS(ns, "path");
        arrow.setAttribute("d", "M 0 0 L 10 5 L 0 10 z");
        arrow.setAttribute("fill", "#718494");
        marker.append(arrow);
        defs.append(marker);
        svg.append(defs);

        edges.forEach(edge => {
            const from = positions.get(edge.from);
            const to = positions.get(edge.to);
            const path = document.createElementNS(ns, "path");
            let d;
            let labelX;
            let labelY;
            if (edge.route === "forward") {
                const outgoing = allOutgoing.get(edge.from);
                const incoming = allIncoming.get(edge.to);
                const x1 = from.x + nodeWidth * (outgoing.indexOf(edge) + 1) / (outgoing.length + 1);
                const y1 = from.y + nodeHeight;
                const x2 = to.x + nodeWidth * (incoming.indexOf(edge) + 1) / (incoming.length + 1);
                const y2 = to.y;
                const laneY = trackY.get(`${depths.get(edge.from)}:${sourceTracks.get(edge)}`);
                d = `M ${x1} ${y1} L ${x1} ${laneY} L ${x2} ${laneY} L ${x2} ${y2}`;
                labelX = (x1 + x2) / 2 + 4;
                labelY = laneY - 3;
            } else {
                const outgoing = allOutgoing.get(edge.from);
                const incoming = allIncoming.get(edge.to);
                const x1 = from.x + nodeWidth * (outgoing.indexOf(edge) + 1) / (outgoing.length + 1);
                const y1 = from.y + nodeHeight;
                const x2 = to.x + nodeWidth * (incoming.indexOf(edge) + 1) / (incoming.length + 1);
                const y2 = to.y;
                const routeX = contentWidth - margin + 8 + sideIndices.get(edge) * 14;
                const sourceLaneY = trackY.get(`${depths.get(edge.from)}:${sourceTracks.get(edge)}`);
                const targetLaneY = trackY.get(`${depths.get(edge.to) - 1}:${targetTracks.get(edge)}`);
                d = `M ${x1} ${y1} L ${x1} ${sourceLaneY} L ${routeX} ${sourceLaneY}` +
                    ` L ${routeX} ${targetLaneY} L ${x2} ${targetLaneY} L ${x2} ${y2}`;
                labelX = routeX + 4;
                labelY = (sourceLaneY + targetLaneY) / 2 - 4;
            }
            path.setAttribute("d", d);
            path.setAttribute("class", "cfg-edge");
            path.setAttribute("marker-end", "url(#cfg-arrow)");
            svg.append(path);

            if (edge.label) {
                const edgeLabel = document.createElementNS(ns, "text");
                edgeLabel.setAttribute("x", String(labelX));
                edgeLabel.setAttribute("y", String(labelY));
                edgeLabel.setAttribute("class", "cfg-edge-label");
                edgeLabel.textContent = edge.label;
                svg.append(edgeLabel);
            }
        });

        nodes.forEach(node => {
            const position = positions.get(node.id);
            const group = document.createElementNS(ns, "g");
            group.setAttribute("class", `cfg-node cfg-${node.kind}`);
            const title = document.createElementNS(ns, "title");
            title.textContent = node.text;
            group.append(title);
            if (node.kind === "terminal") {
                const shape = document.createElementNS(ns, "ellipse");
                shape.setAttribute("cx", String(position.x + nodeWidth / 2));
                shape.setAttribute("cy", String(position.y + nodeHeight / 2));
                shape.setAttribute("rx", String(nodeWidth / 2));
                shape.setAttribute("ry", String(nodeHeight / 2));
                group.append(shape);
            } else {
                const shape = document.createElementNS(ns, "rect");
                shape.setAttribute("x", String(position.x));
                shape.setAttribute("y", String(position.y));
                shape.setAttribute("width", String(nodeWidth));
                shape.setAttribute("height", String(nodeHeight));
                shape.setAttribute("rx", "5");
                group.append(shape);
            }
            const text = document.createElementNS(ns, "text");
            const lines = wrapText(node.text);
            const firstY = position.y + nodeHeight / 2 - ((lines.length - 1) * 6);
            lines.forEach((line, index) => {
                const tspan = document.createElementNS(ns, "tspan");
                tspan.setAttribute("x", String(position.x + nodeWidth / 2));
                tspan.setAttribute("y", String(firstY + index * 12));
                tspan.textContent = line;
                text.append(tspan);
            });
            group.append(text);
            svg.append(group);
        });

        graph.replaceChildren(svg);
    }

    function update() {
        graph.replaceChildren();
        select.replaceChildren();
        if (!compilation || "type" in compilation) {
            const option = document.createElement("option");
            option.textContent = "(script)";
            select.append(option);
            const message = document.createElement("div");
            message.className = "control-flow-message";
            message.textContent = compilation
                ? "Fix the compilation error to display the control-flow graph."
                : "Waiting for compilation.";
            renderGraph({statements: []});
            graph.prepend(message);
            return;
        }

        const bodies = getBodies(compilation);
        if (!bodies.length) {
            const option = document.createElement("option");
            option.textContent = "(no executable code)";
            select.append(option);
            renderGraph({statements: []});
            return;
        }

        selectedIndex = Math.min(selectedIndex, bodies.length - 1);
        bodies.forEach((_, index) => addOption(bodies, index));
        select.value = String(selectedIndex);
        renderGraph(bodies[selectedIndex].body);
    }

    select.addEventListener("change", () => {
        selectedIndex = Number(select.value);
        update();
    });

    editor.compilationListeners.push(result => {
        compilation = result;
        selectedIndex = 0;
        update();
    });

    editor.editor.session.on("change", () => {
        compilation = undefined;
        update();
        window.setTimeout(() => editor.checkCompilation(), 200);
    });

    editor.checkCompilation();
    return root;
}
</script>
Displays the control-flow graph for a script or procedure. Branches and loops show their true/false edges; every graph includes entry and exit nodes.

<matte-ace call="" controlflow>
int classify(int n) {
    int total = 0;
    while (n > 0) {
        if (n % 2 == 0) {
            total = total + n;
        } else {
            total = total + 1;
        }
        n = n - 1;
    }
    return total;
}
</matte-ace>
</body>
</html>
