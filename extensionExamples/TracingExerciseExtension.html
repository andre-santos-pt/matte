<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/html">
<head>
    <title>Demo tracing exercise</title>

</head>
<body>
<script src="../dist/matte-web-ace.js" defer></script>
<script src="./tracing-matte.js"></script>

<h1>Tracing</h1>
Extension to perform tracing exercises on scripts. Upon execution, the user inserts the sequence of variable values, which are checked against the trace.

<matte-ace call="" tracing>
int i;
i = 1;
int j = i;
i = j * 2;
i = i * 3;
</matte-ace>

</body>
</html>
