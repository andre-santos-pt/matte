<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/html">
<head>
    <title>Demo ChartJS</title>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/ace.js"></script>
<script src="../dist/matte-web-ace.js" defer></script>


<hr>
<h1>Bar Chart</h1>
<matte-ace height="180" width="450" call="naturals(4)" ext-chart>
int[] naturals(int n) {
    int[] a = new int[n];
    for(int i = 0; i < n; i++)
        a[i] = i + 1;
    return a;
}
</matte-ace>
<script>
function chart(editor) {
    const wrapper = document.createElement('div');
    wrapper.style.height = '180px';
    const canvas = document.createElement('canvas');
    wrapper.appendChild(canvas);
    editor.container.after(wrapper);
    let chart = new Chart(canvas, {
        type: 'bar',
        data: {
            labels: [],
            datasets: [{label: 'value', data: []}]
        }
    });
    editor.container.after(canvas);
    editor.afterRunListeners.push(r => {
        const ret = r.result.evaluation;
        if(Array.isArray(ret)) {
            chart.data.labels = ret.map((_, i) => i);
            chart.data.datasets[0].data = ret;
            chart.update();
        }
    });
}
</script>
<hr>

</body>
</html>
