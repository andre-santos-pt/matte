<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/html">
<head>
<title>Demo DIV</title>
</head>
<body>
<script src="../dist/matte-web-ace.js" defer></script>

<div class="matte-ace" data-call="sum([15.2, 20.2, 25.5])">
double sum(double[] a) {
    double s = 0.0;
    int i = 0;
    while(i < a.length) {
        s = s + a[i];
        i++;
    }
    return s;
}
</div>

<div class="matte-ace"></div>



</body>
</html>
