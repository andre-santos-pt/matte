<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/html">
<head>
    <title>Demo stack frames</title>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/ace.js"></script>
<script src="../dist/matte-web-ace.js" defer></script>

<h1>Stack frames</h1>
<hr>
<matte-ace call="factorial(4)" ext-table ext-callstack>
int factorial(int n) {
    if (n == 0) return 1;
    else return n * factorial(n - 1);
}
</matte-ace>

<matte-ace call="firstDigit(2026)" ext-callstack>
    int firstDigit(int n) {
    if (n < 10) return n;
    else return firstDigit(n / 10);
    }
</matte-ace>

<matte-ace call="fib(7)"  ext-callstack>
    int fib(int n) {
    if (n <= 1) return n;
    else return fib(n-1) + fib(n-2);
    }
</matte-ace>
<hr>

<script>
    function table(editor) {
        const div = document.createElement('div');
        editor.stepListeners.push((t, i) => {
            div.replaceChildren()
            for(let j = 0; j < i; j++)
                if(t[j].call) {
                    const table = document.createElement('table');
                    const tbody = table.createTBody();
                    for (const [key, value] of t[j].stack.variables) {
                        const row = tbody.insertRow();
                        const th = document.createElement('th');
                        th.textContent = key;
                        th.style.textAlign = "left";
                        row.appendChild(th);
                        const td = row.insertCell();
                        td.textContent = value.evaluation;
                    }
                    div.append(table)
                    div.append(document.createElement('hr'))
                }
            const table = document.createElement('table');
            const tbody = table.createTBody();
            console.log(i)
            console.log(t[i])
            for (const [key, value] of t[i].stack.variables) {
                const row = tbody.insertRow();
                const th = document.createElement('th');
                th.textContent = key;
                th.style.textAlign = "left";
                row.appendChild(th);
                const td = row.insertCell();
                td.textContent = value.evaluation;
            }
            div.append(table)
        })
        return div
    }
</script>

</body>
</html>
