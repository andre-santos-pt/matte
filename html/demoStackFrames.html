<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/html">
<head>
    <title>Demo stack frames</title>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/ace.js"></script>
<script src="../dist/matte-web-ace.js" defer></script>

<h1>Stack frames</h1>
<hr>
<matte-ace call="factorial(4)" ext-table ext-callchain>
int factorial(int n) {
    if (n == 0) return 1;
    else return n * factorial(n - 1);
}
</matte-ace>

<matte-ace call="firstDigit(2026)" ext-table ext-callchain>
    int firstDigit(int n) {
    if (n < 10) return n;
    else return firstDigit(n / 10);
    }
</matte-ace>
<hr>

<script>
    function table(editor) {
        const div = document.createElement('div');
        editor.container.after(div)
        editor.stepListeners.push((t, i) => {
            div.replaceChildren()
            for(let j = 0; j < i; j++)
                if(t[j].call) {
                    const table = document.createElement('table');
                    const tbody = table.createTBody();
                    for (const [key, value] of t[j].stack.variables) {
                        const row = tbody.insertRow();
                        const th = document.createElement('th');
                        th.textContent = key;
                        th.style.textAlign = "left";
                        row.appendChild(th);
                        const td = row.insertCell();
                        td.textContent = value.evaluation;
                    }
                    div.append(table)
                    div.append(document.createElement('hr'))
                }
            const table = document.createElement('table');
            const tbody = table.createTBody();
            for (const [key, value] of t[i].stack.variables) {
                const row = tbody.insertRow();
                const th = document.createElement('th');
                th.textContent = key;
                th.style.textAlign = "left";
                row.appendChild(th);
                const td = row.insertCell();
                td.textContent = value.evaluation;
            }
            div.append(table)
        })
    }

    function callchain(editor) {
        function stack(n) {
            if(!n.parent)
                return [];
            else
                return [...stack(n.parent), n.parent]
        }
        const div = document.createElement('div');
        editor.container.after(div)
        editor.afterRunListeners.push((r) => console.log(editor.trace))
        editor.stepListeners.push((t, i) => {
            let html = ""
            const s = stack(t[i])
            for(let j = 0; j < s.length; j++) {
                for (let d = j; d !== 0; d--)
                    html += "&nbsp;&nbsp;&nbsp;&nbsp;"
                html += s[j].materialization

                for(let r = i; r >= 0; r--)
                    if(t[r].returnStatement && t[r].parent === s[j]) {
                        html += " = " + t[r].materialization
                        break
                    }

                html += "<br>"
            }

            div.replaceChildren()
            div.innerHTML = html
        })


    }
</script>

</body>
</html>
